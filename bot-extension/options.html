<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BayzBot Player Options</title>
    <style>
        body { background: #111827; color: #e5e7eb; font: 14px system-ui, sans-serif; margin: 0; padding: 24px; }
        main { max-width: 560px; margin: auto; }
        label { display: block; font-weight: 600; margin: 18px 0 6px; }
        input { box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid #4b5563; border-radius: 8px; background: #0b0f19; color: #fff; }
        button { margin-top: 20px; border: 0; border-radius: 8px; padding: 10px 16px; background: #0891b2; color: #fff; cursor: pointer; font-weight: 600; }
        p { color: #9ca3af; line-height: 1.5; }
        #status { min-height: 1.5em; }
    </style>
</head>
<body>
    <main>
        <h1>BayzBot Player</h1>
        <p>Set the local backend address and the Dolphin browser profile ID for this profile.</p>
        <form id="options">
            <label for="backendUrl">Backend WebSocket URL</label>
            <input id="backendUrl" type="url" value="ws://localhost:8765" required>
            <label for="profileId">Dolphin Browser Profile ID</label>
            <input id="profileId" type="text" inputmode="numeric" pattern="[0-9]+" required>
            <button type="submit">Save settings</button>
            <p id="status" role="status"></p>
        </form>
    </main>
    <script src="options.js"></script>
</body>
</html>
